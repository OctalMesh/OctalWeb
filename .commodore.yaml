role:   squadron
id:     octalweb
binary: ow

reactor:
  provider: tilt
  network:  octalnet
  context:  ./

  blueprints:
    - env:  dev
      path: ./infra/dev/tilt/Tiltfile

    - env:  staging
      path: ./infra/staging/tilt/Tiltfile

manifest:
  - id:   console
    path: ./modules/console

  - id:   shop
    path: ./modules/shop

  - id:   links
    path: ./modules/links

  - id:   design
    path: ./modules/design
